services:
  - type: web
    name: kalki-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: APP_ENV
        value: production
      - key: OLOSTEP_MODE
        value: replay
      - key: DATABASE_URL
        sync: false
      - key: OLOSTEP_API_KEY
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://kalki-llp.vercel.app
